<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<sc-if value="{{ isA }}" hint-placeholder-val="{{ true }}">
<section data-parallax-root="" aria-label="Welcome" style="position:relative;min-height:clamp(640px,52cqw,800px);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#E41E26;color:#fff;font-family:'Glacial Indifference',sans-serif;">
  <dc-import name="PhotoSlot" id="HOME-HERO-01" fill="{{ true }}" labelPos="top" style="position:absolute;inset:0;" hint-size="100%,100%"></dc-import>
  <div style="position:relative;padding:0 clamp(20px,5.5cqw,80px) clamp(36px,5cqw,72px);display:flex;flex-direction:column;gap:clamp(18px,2.4cqw,32px);">
    <h1 aria-label="Ottawa Regional Youth Choir" style="margin:0;font-weight:700;font-size:clamp(128px,30cqw,450px);line-height:.78;letter-spacing:-.03em;display:flex;"><span data-reveal="" data-delay="0" data-depth="10">O</span><span data-reveal="" data-delay="90" data-depth="-16" style="margin-left:-.15em;opacity:.8;">R</span><span data-reveal="" data-delay="180" data-depth="14">Y</span><span data-reveal="" data-delay="270" data-depth="-9">C</span></h1>
    <div data-reveal="" data-delay="450" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 40px;">
      <p style="margin:0;font-style:italic;font-weight:700;font-size:clamp(28px,3.2cqw,46px);line-height:1.1;">Young Ottawa voices, 15–25.</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px;">
        <a href="/sing" data-magnetic="" style="display:inline-flex;align-items:center;min-height:54px;padding:0 28px;border-radius:999px;background:#fff;color:#000;border:2px solid #fff;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:background-color .25s,color .25s,border-color .25s;" style-hover="background:#000;border-color:#000;color:#fff;">Join the Choir</a>
        <a data-magnetic="" href="/events" style="display:inline-flex;align-items:center;min-height:54px;padding:0 28px;border-radius:999px;background:transparent;color:#fff;border:2px solid #fff;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:background-color .25s,color .25s,border-color .25s;" style-hover="background:#fff;color:#000;">See the Season</a>
      </div>
    </div>
  </div>
</section>
</sc-if>
<sc-if value="{{ isB }}" hint-placeholder-val="{{ false }}">
<section data-parallax-root="" aria-label="Welcome" style="position:relative;overflow:hidden;background:#fff;color:#000;font-family:'Glacial Indifference',sans-serif;padding:clamp(40px,5cqw,80px) clamp(20px,5.5cqw,80px) clamp(56px,6cqw,96px);">
  <div style="position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:48px clamp(32px,5cqw,88px);">
    <div data-stagger="" style="flex:1 1 520px;display:flex;flex-direction:column;gap:24px;position:relative;z-index:1;">
      <span style="font-style:italic;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:#E41E26;">Ottawa Regional Youth Choir · Since 1982</span>
      <h1 style="margin:0;font-weight:700;font-size:clamp(58px,7.6cqw,124px);line-height:.9;text-transform:uppercase;letter-spacing:-.01em;text-wrap:balance;">Young Ottawa voices, 15–25.</h1>
      <p style="margin:0;font-size:clamp(18px,1.5cqw,21px);line-height:1.55;max-width:500px;">About 50 young singers, rehearsing Tuesday nights in Sandy Hill and performing across Ottawa.</p>
      <div style="display:flex;flex-wrap:wrap;gap:12px;">
        <a href="/sing" data-magnetic="" style="display:inline-flex;align-items:center;min-height:54px;padding:0 28px;border-radius:999px;background:#E41E26;color:#fff;border:2px solid #E41E26;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:background-color .25s,color .25s,border-color .25s;" style-hover="background:#B8141B;border-color:#B8141B;color:#fff;">Join the Choir</a>
        <a data-magnetic="" href="/events" style="display:inline-flex;align-items:center;min-height:54px;padding:0 28px;border-radius:999px;background:transparent;color:#000;border:2px solid #000;font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none;transition:background-color .25s,color .25s,border-color .25s;" style-hover="background:#000;color:#fff;">See the Season</a>
      </div>
    </div>
    <div style="flex:1 1 380px;max-width:560px;position:relative;">
      <div aria-hidden="true" data-spin="90" data-depth="-18" style="position:absolute;width:150%;aspect-ratio:1;border-radius:50%;border:clamp(30px,3.6cqw,58px) solid;border-color:#E41E26 #E41E26 transparent #E41E26;left:18%;top:-14%;"></div>
      <div data-depth="8" style="position:relative;"><dc-import name="PhotoSlot" id="HOME-HEROB-01" hint-size="100%,600px"></dc-import></div>
      <div data-depth="22" style="position:absolute;width:38%;left:-10%;bottom:-6%;border:8px solid #fff;border-radius:50%;"><dc-import name="PhotoSlot" id="HOME-HEROB-02" compact="{{ true }}" hint-size="100%,160px"></dc-import></div>
      <div aria-hidden="true" data-float="" style="position:absolute;width:34px;height:34px;border-radius:50%;background:#56C4C4;left:-4%;top:12%;"></div>
    </div>
  </div>
</section>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:800},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;A&quot;,&quot;B&quot;],&quot;default&quot;:&quot;A&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() { const b = this.props.variant === 'B'; return { isA: !b, isB: b }; }
}
</script>
</body>
</html>
