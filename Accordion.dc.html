<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="content.js"></script><script src="motion.js"></script></helmet>
<div style="display:flex;flex-direction:column;gap:10px;font-family:'Glacial Indifference',sans-serif;">
  <sc-for list="{{ items }}" as="it" hint-placeholder-count="5">
    <div style="background:#DFEDEA;color:#000;border-radius:20px;">
      <h3 style="margin:0;">
        <button onClick="{{ it.toggle }}" aria-expanded="{{ it.open }}" style="width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:16px 22px;border:0;background:transparent;color:#000;font:inherit;font-weight:700;font-size:19px;text-align:left;cursor:pointer;border-radius:20px;">
          <span>{{ it.q }}</span>
          <span aria-hidden="true" style="flex:0 0 36px;height:36px;border-radius:50%;background:{{ it.dotBg }};color:{{ it.dotFg }};display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;transition:background-color .25s,color .25s;">{{ it.sign }}</span>
        </button>
      </h3>
      <sc-if value="{{ it.open }}" hint-placeholder-val="{{ false }}">
        <p data-enter="" style="margin:0;padding:0 22px 22px;font-size:17px;line-height:1.55;max-width:760px;">{{ it.a }}</p>
      </sc-if>
    </div>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:600},&quot;source&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;faq&quot;,&quot;contactFaq&quot;],&quot;default&quot;:&quot;faq&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;limit&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  state = { open: 0 };
  componentDidMount() { if (!window.ORYC_CONTENT) this._t = setInterval(() => { if (window.ORYC_CONTENT) { clearInterval(this._t); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const src = (window.ORYC_CONTENT || {})[this.props.source || 'faq'] || [];
    const list = this.props.limit ? src.slice(0, this.props.limit) : src;
    return {
      items: list.map((it, i) => {
        const open = this.state.open === i;
        return { ...it, open, sign: open ? '–' : '+', dotBg: open ? '#000' : '#fff', dotFg: open ? '#fff' : '#000', toggle: () => this.setState({ open: open ? -1 : i }) };
      })
    };
  }
}
</script>
</body>
</html>
