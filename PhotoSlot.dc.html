<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="photos.js"></script></helmet>
<div role="img" aria-label="{{ alt }}" data-slot-id="{{ id }}" title="{{ tip }}" style="position:relative;width:100%;height:{{ h }};aspect-ratio:{{ ar }};border-radius:{{ radius }};overflow:hidden;background:{{ bg }};color:{{ fg }};font-family:'Glacial Indifference',sans-serif;">
  <sc-if value="{{ hasSrc }}" hint-placeholder-val="{{ false }}">
    <img src="{{ src }}" alt="{{ alt }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:{{ filter }};">
    <sc-if value="{{ isDuo }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:#E41E26;mix-blend-mode:multiply;"></div></sc-if>
  </sc-if>
  <sc-if value="{{ showFull }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:{{ justify }};gap:8px;padding:clamp(14px,4%,28px);">
      <div style="display:flex;align-items:center;gap:8px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
        <span style="font-weight:700;font-size:12px;letter-spacing:.12em;padding:4px 10px;border-radius:999px;white-space:nowrap;background:{{ fg }};color:{{ bg }};">{{ id }}</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:4px;max-width:460px;">
        <div style="font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;">{{ shot }}</div>
        <div style="font-size:15px;line-height:1.35;">{{ desc }}</div>
        <div style="font-size:12px;line-height:1.4;font-style:italic;">{{ specs }}</div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ showCenter }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16%;text-align:center;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
      <span style="font-weight:700;font-size:11px;letter-spacing:.1em;">{{ id }}</span>
      <sc-if value="{{ circleText }}" hint-placeholder-val="{{ false }}">
        <span style="font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;">{{ shot }}</span>
        <span style="font-size:13px;line-height:1.3;">{{ desc }}</span>
        <span style="font-size:11px;font-style:italic;line-height:1.3;">{{ specs }}</span>
      </sc-if>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:320},&quot;id&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;HOME-SUPPORT-01&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;shape&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;rect&quot;,&quot;circle&quot;,&quot;arch&quot;,&quot;half&quot;,&quot;bleed&quot;],&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;fill&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;labelPos&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;top&quot;,&quot;bottom&quot;],&quot;default&quot;:&quot;bottom&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  componentDidMount() {
    if (!window.ORYC_PHOTOS) this._t = setInterval(() => { if (window.ORYC_PHOTOS) { clearInterval(this._t); this.forceUpdate(); } }, 60);
  }
  componentWillUnmount() { clearInterval(this._t); }
  renderVals() {
    const p = this.props;
    const d = (window.ORYC_PHOTOS || {})[p.id] || { shot: '', desc: '', ratio: p.ratio || '16:9', min: '', treat: 'none', crop: 'rect', alt: '' };
    const crop = p.shape || d.crop;
    const ratio = p.ratio || d.ratio;
    const [rw, rh] = ratio.split(':').map(Number);
    const orient = rw > rh ? 'landscape' : rw < rh ? 'portrait' : 'square';
    const treatLabel = { duotone: 'red duotone', bw: 'black & white', none: 'no treatment' }[d.treat];
    const cropLabel = { circle: 'circle crop', arch: 'arch crop', half: 'half-circle crop', bleed: 'full-bleed', rect: '' }[crop];
    const specs = [ratio, 'min ' + d.min, orient, treatLabel, cropLabel].filter(Boolean).join(' · ');
    const radius = crop === 'circle' ? '50%' : crop === 'arch' ? '9999px 9999px 0 0' : crop === 'half' ? '9999px 9999px 0 0' : crop === 'bleed' ? '0' : (p.radius ?? '16px');
    const pal = { duotone: ['#E41E26', '#FFFFFF'], bw: ['#D6D6D6', '#111111'], none: ['#DFEDEA', '#004238'] }[d.treat];
    const centered = crop === 'circle' || !!p.compact;
    return {
      id: p.id, shot: d.shot, desc: d.desc, specs, alt: d.alt,
      tip: p.id + ' — ' + d.shot + ': ' + d.desc + ' (' + specs + ')',
      ar: p.fill ? 'auto' : rw + ' / ' + rh,
      h: p.fill ? '100%' : 'auto',
      radius, bg: pal[0], fg: pal[1],
      src: d.src, hasSrc: !!d.src,
      filter: d.treat === 'none' ? 'none' : 'grayscale(1) contrast(1.05)',
      isDuo: d.treat === 'duotone',
      showFull: !d.src && !centered, showCenter: !d.src && centered,
      circleText: !!p.circleText,
      justify: p.labelPos === 'top' ? 'flex-start' : 'flex-end'
    };
  }
}
</script>
</body>
</html>
